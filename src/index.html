<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Q&amp;A Board</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Q&amp;A Board</h1>
        <p>Ask the speaker anything.</p>
      </header>

      <form id="ask-form">
        <label for="question-text">Your question</label>
        <textarea id="question-text" name="text" rows="3" maxlength="280" required></textarea>
        <div class="form-footer">
          <span id="form-error" role="alert"></span>
          <button type="submit">Ask</button>
        </div>
      </form>

      <section aria-labelledby="questions-heading">
        <h2 id="questions-heading">Questions</h2>
        <p id="empty-state">No questions yet. Be the first to ask.</p>
        <ol id="questions"></ol>
      </section>
    </main>
    <script type="module" src="./client.ts"></script>
  </body>
</html>
